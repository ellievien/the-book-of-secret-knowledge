# XcodeGen spec: `xcodegen generate` writes Reflect.xcodeproj (build.sh does this for you).
name: Reflect
options:
  bundleIdPrefix: com.neverheard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Your Personal Team ID is passed in by build.sh (DEVELOPMENT_TEAM=...).
    DEVELOPMENT_TEAM: ""
targets:
  Reflect:
    type: application
    platform: iOS
    sources:
      - path: Reflect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neverheard.reflect
        PRODUCT_NAME: Reflect
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Reflect/Info.plist
      properties:
        CFBundleDisplayName: Reflect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Reflect finds the Reflect helper on your computer and shows the Claude window over your Wi-Fi.
        NSBonjourServices:
          - _reflect._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
  ReflectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReflectTests
    dependencies:
      - target: Reflect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neverheard.reflect.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  Reflect:
    build:
      targets:
        Reflect: all
        ReflectTests: [test]
    test:
      config: Debug
      targets:
        - ReflectTests
    run:
      config: Debug
    archive:
      config: Release
